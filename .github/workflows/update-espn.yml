name: Update ESPN standings

on:
  schedule:
    # Every 2 hours, all day Sunday/Monday/Thursday (NFL game days, UTC-ish).
    # Cron is in UTC — adjust if you want tighter/looser timing.
    - cron: '0 */2 * * 0,1,4'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install espn_api

      - name: Fetch ESPN standings
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_SEASON: ${{ vars.ESPN_SEASON }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/fetch_espn.py

      - name: Commit updated data.json
        run: |
          git config user.name "bird-gang-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Update live standings"
          git push
